{% extends "base.html" %}
{% block title %}Verify Phone{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-4 text-center">
                    <i class="bi bi-phone-vibrate display-4 text-success"></i>
                    <h3 class="mt-3">Verify Your Phone</h3>
                    <p class="text-muted">Enter the 6-digit OTP sent to your phone.</p>
                    {% if demo_otp %}
                    <div class="alert alert-info small">
                        <strong>Demo Mode:</strong> OTP is <code>{{ demo_otp }}</code>
                    </div>
                    {% endif %}
                    <form method="post">
                        <input type="text" name="otp" class="form-control otp-box mb-3" maxlength="6" placeholder="000000" required autofocus>
                        <button type="submit" class="btn btn-naija w-100">Verify</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
